<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' https://themi.co.kr blob: data:; connect-src 'self'; base-uri 'none'; form-action 'none'"><title>디자인더미 | 시공 관리</title><style>*{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;background:#f2f0eb;color:#28251f;margin:0}main{max-width:900px;margin:auto;padding:24px 16px}section{background:white;border:1px solid #dedbd4;border-radius:12px;padding:20px;margin:16px 0}h1,h2{line-height:1.3}label{display:block;margin:12px 0}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #b9b5ad;border-radius:6px;font:inherit}button{font:inherit;padding:10px 15px;margin:4px 4px 4px 0;border:1px solid #29251f;border-radius:6px;background:#29251f;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:wait}button.secondary{background:white;color:#29251f}small{display:block;color:#625c54}#photos>div{display:grid;grid-template-columns:110px 1fr;gap:12px;border-bottom:1px solid #ddd;padding:12px 0}#photos img{width:110px;height:100px;object-fit:cover}#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#5a3923}#status[role=alert]{color:#a02920}[hidden]{display:none!important}</style></head><body><main><h1>THEMI · 시공 사례 관리</h1><p>사진과 시공 내용을 등록하면 정적 HTML과 사이트맵을 생성합니다.</p><section id="login"><h2>관리자 인증</h2><p>Cloudflare 이메일 인증 후 시공 사례를 불러옵니다.</p><button id="connect">다시 불러오기</button></section><p id="status" aria-live="polite"></p><div id="workspace" hidden><section><h2>등록된 시공 사례</h2><div id="list"></div><button id="new">새 사례 작성</button><button id="logout" class="secondary">로그아웃</button></section><section><h2 id="editor-title">새 시공 사례</h2><form id="editor"><label>시공 제목<input id="title" maxlength="100" required placeholder="하남 미사 34평 아파트 리모델링"></label><label>지역<input id="region" maxlength="80" required placeholder="하남시 미사"></label><label>공간 유형<select id="category"><option>아파트</option><option>주택</option><option>상업공간</option><option>부분 시공</option></select></label><label>평수·면적 (선택)<input id="size" maxlength="40" placeholder="34평"></label><label>시공 범위·자재·설계 설명<textarea id="description" rows="6" maxlength="5000" required></textarea></label><label>완료일 (선택)<input id="date" type="date"></label><label>시공 사진 (최대 12장, JPG/PNG)<input id="files" type="file" accept="image/jpeg,image/png" multiple></label><small>긴 변 최대 1600px JPEG로 재인코딩하여 위치정보를 제거합니다. 첫 사진이 대표 이미지입니다. 고객 얼굴, 동·호수, 개인정보 및 공개 권한을 확인하세요. 공개 저장소에 게시되므로 삭제 후에도 Git 기록에 남을 수 있습니다.</small><div id="photos"></div><label><input id="consent" type="checkbox" style="display:inline;width:auto" required> 공개 권한과 개인정보를 확인했습니다.</label><button id="publish" type="submit">게시 / 수정 저장</button><button id="remove" class="secondary" type="button" hidden>공개 사례 삭제</button></form></section></div></main><script src="admin.js" defer></script></body></html>
